CONFIG_BOARD_NICE_NANO_V2=y

# 扫描驱动：独立GPIO按键
CONFIG_ZMK_KSCAN_GPIO_KEYS=y

# 导电胶消抖15ms
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE=15

# 蓝牙USB自动切换
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_AUTO=y
CONFIG_ZMK_USB_AUTO_ENABLE=y
CONFIG_ZMK_BLE=y

# 电池电量上报
CONFIG_ZMK_BATTERY_REPORTING=y

###########################
# 功耗优化（nice!nano v2）
###########################
# 空闲时降低蓝牙广播、休眠
CONFIG_BLE_ADV_INTERVAL_MIN=800
CONFIG_BLE_ADV_INTERVAL_MAX=1200
CONFIG_BLE_CONN_SUPERVISION_TIMEOUT=400
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000
CONFIG_ZMK_BLE_SLEEP_ON_IDLE=y

# 关闭无用外设节省功耗
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_LOG_DEFAULT_LEVEL_NONE=y

# 关闭调试
CONFIG_DEBUG=n
