# 启用 USB 和蓝牙
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# 自动切换（USB优先）
CONFIG_ZMK_BLE_AUTO_PAIR=y
CONFIG_ZMK_BLE_FAST_PAIR=y
CONFIG_ZMK_SETTINGS=y

# 组合键支持
CONFIG_ZMK_COMBO=y

# 低功耗优化
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_IDLE_TIMEOUT=6000
CONFIG_ZMK_SLEEP_MAX_DURATION=60000

# 关闭省电外设
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n

# 减少蓝牙广播功耗
CONFIG_BT_CTLR_RX_BUFFERS=2
CONFIG_BT_CTLR_TX_BUFFERS=2
