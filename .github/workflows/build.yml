name: Build Firmware
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZMK Firmware
        uses: zmkfirmware/zmk-build-action@main
        with:
          board: promicro_nrf52840
          shield: gamepad
