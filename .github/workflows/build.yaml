name: Build ZMK Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West
        run: pip install west

      - name: Initialize West
        run: |
          west init -l config/
          west update

      - name: Build Firmware
        run: |
          west build -b nice_nano_v2 -- -DSHIELD=nice12
          mkdir -p firmware
          cp build/zephyr/zmk.uf2 firmware/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: nice12_firmware
          path: firmware/
