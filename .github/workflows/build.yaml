name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZMK Firmware
        uses: zmkfirmware/zmk-build-action@v2
        with:
          # 锁定ZMK版本，建议固定tag，避免主干变动导致编译失败
          zmk_ref: v0.15.0
          config_path: ${{ github.workspace }}
