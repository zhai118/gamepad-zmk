name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:2.5
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          west build -b nice_nano_v2 zmk/app -- -DZMK_CONFIG="${{ github.workspace }}" -DSHIELD=mykeyboard

      - name: Upload uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmk_nice_nano_v2_mykeyboard
          path: build/zephyr/*.uf2
