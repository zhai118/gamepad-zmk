name: Build ZMK Firmware

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑latest
    container:
      image: zmkfirmware/zmk‑build:v0.4

    steps:
      - name: Checkout user configuration
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          west build -d build -b promicro_nrf52840 -- -DSHIELD=promicro_12key
          
      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: firmware
          path: build/zephyr/*.uf2
