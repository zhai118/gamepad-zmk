name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    container:
      image: zmkfirmware/zmk‑build‑arm:2.5
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout ZMK source
        uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zmk
          ref: main
          path: zmk

      - name: West init & update
        run: |
          cd zmk
          west init‑l .
          west update

      - name: Build firmware
        run: |
          cd zmk
          west build -b nice_nano_v2 app -- -DZMK_CONFIG=/github/workspace/config -DSHIELD=mykeyboard

      - name: Upload uf2 artifact
        uses: actions/upload‑artifact@v4
        with:
          name: zmk_nice_nano_v2_mykeyboard
          path: zmk/build/zephyr/*.uf2
